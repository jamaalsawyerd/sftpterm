name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - name: go test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: go test (race, coverage)
        if: runner.os == 'Linux'
        run: |
          go test -race -coverpkg=./internal/... -coverprofile=cover.out ./...
          echo "### Coverage: $(go tool cover -func=cover.out | tail -1 | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz each target briefly
        run: make fuzz FUZZTIME=15s

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
